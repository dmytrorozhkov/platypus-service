name: Package Neon

on:
  workflow_dispatch:
    inputs:
      runtime_config:
        description: 'Nonsecret runtime JSON: account, host, origin, SSM ARN and version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-neon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'dmytrorozhkov/platypus-service' }}
    uses: ./.github/workflows/ci.yml

  package:
    name: Prepare checked Neon package
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'

    steps:
      - name: Check out exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm.cmd install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Build exact source
        run: npm.cmd run build

      - name: Prepare and verify Neon release
        id: bundle
        env:
          NEON_RUNTIME_JSON: ${{ inputs.runtime_config }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = '.local/neon-aws/runtime.json'
          New-Item -ItemType Directory -Force '.local/neon-aws' | Out-Null
          $env:NEON_RUNTIME_JSON | Set-Content -LiteralPath $runtime -Encoding utf8

          $release = "neon-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          $prepared = & node scripts/neon-aws/release.mjs prepare `
            --release $release `
            --source-sha $env:GITHUB_SHA `
            --runtime $runtime
          if ($LASTEXITCODE -ne 0) {
            throw 'Neon package preparation failed.'
          }

          $receipt = $prepared | ConvertFrom-Json

          & node scripts/neon-aws/release.mjs verify `
            --release $release `
            --source-sha $env:GITHUB_SHA `
            --runtime $runtime `
            --manifest-sha256 $receipt.manifestSha256
          if ($LASTEXITCODE -ne 0) {
            throw 'Neon package verification failed.'
          }

          "release=$release" >> $env:GITHUB_OUTPUT
          "directory=.local/neon-aws/releases/$release" >> $env:GITHUB_OUTPUT
          "manifest-sha256=$($receipt.manifestSha256)" >> $env:GITHUB_OUTPUT

      - name: Upload verified package
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.release }}
          path: ${{ steps.bundle.outputs.directory }}/
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true

      - name: Record package receipt
        env:
          RELEASE: ${{ steps.bundle.outputs.release }}
          MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest-sha256 }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          @(
            'Neon package preparation only. Not deployed.'
            "Source: $env:GITHUB_SHA"
            "Release: $env:RELEASE"
            "Manifest SHA256: $env:MANIFEST_SHA256"
            "Artifact ID: $env:ARTIFACT_ID"
            "Artifact digest: $env:ARTIFACT_DIGEST"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
