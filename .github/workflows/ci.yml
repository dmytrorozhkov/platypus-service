name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and builds
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm in the temporary runner
        run: npm.cmd install --global npm@11.19.0

      - name: Show tool versions
        run: |
          node --version
          npm.cmd --version

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Lint
        run: npm.cmd run lint

      - name: Check formatting
        run: npm.cmd run format:check

      - name: Check types
        run: npm.cmd run typecheck

      - name: Build all workspaces
        run: npm.cmd run build

      - name: Test built server
        run: npm.cmd run test --workspace @platypus/server

      - name: Test microfrontend integration contracts
        run: npm.cmd run test:integration

      - name: Test startup and cleanup
        run: npm.cmd run test:startup

      - name: Validate infrastructure offline
        run: npm.cmd run aws:validate

      - name: Test offline packages and browser integration
        run: npm.cmd run test:aws
