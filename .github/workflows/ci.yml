name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_delivery:
        type: boolean
        default: false
      origin:
        type: string
        default: ''
    outputs:
      release:
        value: ${{ jobs.checks.outputs.release }}
      artifact-id:
        value: ${{ jobs.checks.outputs.artifact-id }}
      envelope-sha256:
        value: ${{ jobs.checks.outputs.envelope-sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: Checks and builds
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release: ${{ steps.bundle.outputs.release }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      envelope-sha256: ${{ steps.bundle.outputs.envelope-sha256 }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm in the temporary runner
        run: npm.cmd install --global npm@11.19.0

      - name: Show tool versions
        run: |
          node --version
          npm.cmd --version

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Lint
        run: npm.cmd run lint

      - name: Check formatting
        run: npm.cmd run format:check

      - name: Check types
        run: npm.cmd run typecheck

      - name: Build all workspaces
        run: npm.cmd run build

      - name: Test built server
        run: npm.cmd run test --workspace @platypus/server

      - name: Test microfrontend integration contracts
        run: npm.cmd run test:integration

      - name: Test startup and cleanup
        run: npm.cmd run test:startup

      - name: Validate infrastructure offline
        run: npm.cmd run aws:validate

      - name: Test offline packages and browser integration
        run: npm.cmd run test:aws

      - name: Test delivery failure boundaries offline
        run: npm.cmd run test:delivery

      - name: Prepare checked full delivery bundle
        if: ${{ inputs.package_delivery == true }}
        id: bundle
        env:
          DELIVERY_ORIGIN: ${{ inputs.origin }}
        run: node scripts/delivery/bundle.mjs create

      - name: Transfer bounded bundle to this run's publisher
        if: ${{ inputs.package_delivery == true }}
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.release }}
          path: ${{ steps.bundle.outputs.directory }}/
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
