name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_delivery:
        type: boolean
        default: false
      origin:
        type: string
        default: ''
    outputs:
      release:
        value: ${{ jobs.checks.outputs.release }}
      artifact-id:
        value: ${{ jobs.checks.outputs.artifact-id }}
      artifact-digest:
        value: ${{ jobs.checks.outputs.artifact-digest }}
      envelope-sha256:
        value: ${{ jobs.checks.outputs.envelope-sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  postgres:
    name: Real PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_DB: platypus_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-owner-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'
      PGHOST: 127.0.0.1
      PGPORT: ${{ job.services.postgres.ports[5432] }}
      PGDATABASE: platypus_service_test
      PGUSER: postgres
      PGPASSWORD: ci-postgres-owner-only
      PG_TEST_APP_USER: platypus_app_test
      PG_TEST_APP_PASSWORD: ci-app-only
      PLATYPUS_PG_TEST_OWNED: '1'
      PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm in the temporary runner
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Build workspaces for real database browser integration
        run: npm run build
      - name: Prepare marked disposable database and separate runtime role
        run: node scripts/postgres-ci-setup.mjs
      - name: Verify actual migrations, seed, constraints and read-only runtime
        run: npm run test:postgres:integration
      - name: Install browser in the temporary Linux runner
        run: npx playwright install --with-deps chromium
      - name: Verify persisted HTTP/browser data, actual database restart and Retry
        run: npm run test:postgres:browser

  checks:
    name: Checks and builds
    needs: postgres
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release: ${{ steps.bundle.outputs.release }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
      envelope-sha256: ${{ steps.bundle.outputs.envelope-sha256 }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm in the temporary runner
        run: npm.cmd install --global npm@11.19.0

      - name: Show tool versions
        run: |
          node --version
          npm.cmd --version

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Lint
        run: npm.cmd run lint

      - name: Check formatting
        run: npm.cmd run format:check

      - name: Check types
        run: npm.cmd run typecheck

      - name: Build all workspaces
        run: npm.cmd run build

      - name: Test built server
        run: npm.cmd run test --workspace @platypus/server

      - name: Test microfrontend integration contracts
        run: npm.cmd run test:integration

      - name: Test startup and cleanup
        run: npm.cmd run test:startup

      - name: Validate infrastructure offline
        run: npm.cmd run aws:validate

      - name: Test offline packages and browser integration
        run: npm.cmd run test:aws

      - name: Test delivery failure boundaries offline
        run: npm.cmd run test:delivery

      - name: Prepare checked full delivery bundle
        if: ${{ inputs.package_delivery == true }}
        id: bundle
        env:
          DELIVERY_ORIGIN: ${{ inputs.origin }}
        run: node scripts/delivery/bundle.mjs create

      - name: Transfer bounded bundle to this run's publisher
        if: ${{ inputs.package_delivery == true }}
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.release }}
          path: ${{ steps.bundle.outputs.directory }}/
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
