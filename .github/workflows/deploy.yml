name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Full publication or recovery of a verified completed release
        type: choice
        required: true
        default: publish
        options:
          - publish
          - recover
      release:
        description: Recovery only — exact previously completed release identifier
        type: string
        default: ''
      expected_pending:
        description: Recovery only — exact pending operation identifier, or none
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-aws-learning
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'dmytrorozhkov/platypus-service' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      package_delivery: ${{ inputs.action == 'publish' }}
      origin: ${{ vars.DELIVERY_ORIGIN }}

  publisher:
    name: Publish or recover checked release
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'dmytrorozhkov/platypus-service' }}
    environment: aws-learning
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ''
      DELIVERY_ORIGIN: ${{ vars.DELIVERY_ORIGIN }}
      DELIVERY_ACTION: ${{ inputs.action }}
      DELIVERY_RECOVERY_RELEASE: ${{ inputs.release }}
      DELIVERY_EXPECTED_PENDING: ${{ inputs.expected_pending }}

    steps:
      - name: Require configured protected environment
        id: target
        env:
          DELIVERY_ENABLED: ${{ vars.DELIVERY_ENABLED }}
          DELIVERY_TARGET_JSON: ${{ secrets.DELIVERY_TARGET_JSON }}
          DELIVERY_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          DELIVERY_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if ($env:DELIVERY_ENABLED -cne 'true') { throw 'Delivery is not enabled in the protected environment.' }
          if ($env:DELIVERY_ROLE_ARN -notmatch '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$') { throw 'Publisher role is not configured.' }
          if ($env:DELIVERY_ACCOUNT_ID -notmatch '^[0-9]{12}$') { throw 'Expected account is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:DELIVERY_TARGET_JSON) -or $env:DELIVERY_TARGET_JSON.Length -gt 65536) { throw 'Private delivery target is missing or overlarge.' }
          try { $deliveryTarget = $env:DELIVERY_TARGET_JSON | ConvertFrom-Json -ErrorAction Stop } catch { throw 'Private delivery target is invalid.' }
          if ($deliveryTarget.accountId -cne $env:DELIVERY_ACCOUNT_ID -or $deliveryTarget.resources.origin -cne $env:DELIVERY_ORIGIN) { throw 'Configured delivery identity or origin differs.' }
          if ($env:DELIVERY_ACTION -notin @('publish', 'recover')) { throw 'Unknown delivery operation.' }
          if ($env:DELIVERY_ACTION -eq 'recover') {
            if ($env:DELIVERY_RECOVERY_RELEASE -notmatch '^[a-z0-9][a-z0-9-]{0,47}$') { throw 'Exact recovery release is required.' }
            if ($env:DELIVERY_EXPECTED_PENDING -notmatch '^(none|[a-z0-9][a-z0-9-]{0,79})$') { throw 'Exact pending operation identity is required.' }
          } elseif ($env:DELIVERY_RECOVERY_RELEASE -or $env:DELIVERY_EXPECTED_PENDING) { throw 'Recovery inputs are not accepted for publication.' }
          $deliveryTargetPath = Join-Path $env:RUNNER_TEMP "delivery-target-$env:GITHUB_RUN_ID.json"
          [IO.File]::WriteAllText($deliveryTargetPath, $env:DELIVERY_TARGET_JSON, [Text.UTF8Encoding]::new($false))
          "path=$deliveryTargetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js without a publisher cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Pin publisher npm
        run: npm.cmd install --global npm@11.19.0

      - name: Install verification tools without rebuilding
        run: npm.cmd ci

      - name: Require this run's checked artifact outputs
        if: ${{ inputs.action == 'publish' }}
        env:
          DELIVERY_RELEASE: ${{ needs.checks.outputs.release }}
          DELIVERY_ARTIFACT_ID: ${{ needs.checks.outputs.artifact-id }}
          DELIVERY_ENVELOPE_SHA256: ${{ needs.checks.outputs.envelope-sha256 }}
        run: |
          if ($env:DELIVERY_RELEASE -notmatch '^[a-z0-9][a-z0-9-]{0,47}$' -or $env:DELIVERY_ARTIFACT_ID -notmatch '^[1-9][0-9]+$' -or $env:DELIVERY_ENVELOPE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Checked build artifact outputs are missing or invalid.' }

      - name: Download only the checked artifact from this run
        if: ${{ inputs.action == 'publish' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: .local/aws/releases/${{ needs.checks.outputs.release }}
          merge-multiple: true
          digest-mismatch: error

      - name: Independently verify exact bundle before AWS access
        if: ${{ inputs.action == 'publish' }}
        env:
          DELIVERY_BUNDLE_DIRECTORY: .local/aws/releases/${{ needs.checks.outputs.release }}
          DELIVERY_ENVELOPE_SHA256: ${{ needs.checks.outputs.envelope-sha256 }}
        run: node scripts/delivery/bundle.mjs verify

      - name: Obtain temporary scoped AWS access
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          audience: sts.amazonaws.com
          mask-aws-account-id: true
          unset-current-credentials: true
          output-credentials: false
          action-timeout-s: 120

      - name: Execute bounded publication or explicit recovery
        env:
          DELIVERY_TARGET_PATH: ${{ steps.target.outputs.path }}
          DELIVERY_BUNDLE_DIRECTORY: .local/aws/releases/${{ needs.checks.outputs.release }}
          DELIVERY_ENVELOPE_SHA256: ${{ needs.checks.outputs.envelope-sha256 }}
        run: |
          $deliveryArguments = @('scripts/delivery/cli.mjs', $env:DELIVERY_ACTION, '--target', $env:DELIVERY_TARGET_PATH, '--source-sha', $env:GITHUB_SHA, '--run-id', $env:GITHUB_RUN_ID, '--run-attempt', $env:GITHUB_RUN_ATTEMPT, '--repository', $env:GITHUB_REPOSITORY)
          if ($env:DELIVERY_ACTION -eq 'publish') {
            $deliveryArguments += @('--bundle', $env:DELIVERY_BUNDLE_DIRECTORY, '--envelope-sha256', $env:DELIVERY_ENVELOPE_SHA256)
          } else {
            $deliveryArguments += @('--release', $env:DELIVERY_RECOVERY_RELEASE, '--expected-pending', $env:DELIVERY_EXPECTED_PENDING)
          }
          & node @deliveryArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary private target
        if: ${{ always() }}
        run: |
          $deliveryTargetPath = Join-Path $env:RUNNER_TEMP "delivery-target-$env:GITHUB_RUN_ID.json"
          if (Test-Path -LiteralPath $deliveryTargetPath) { Remove-Item -LiteralPath $deliveryTargetPath -Force }
