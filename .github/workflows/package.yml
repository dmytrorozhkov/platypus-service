name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'dmytrorozhkov/platypus-service' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      package_delivery: true
      origin: ${{ vars.DELIVERY_ORIGIN }}

  receipt:
    name: Record checked package
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'dmytrorozhkov/platypus-service' }}
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up summary runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Write validated package preparation receipt
        env:
          PACKAGE_RELEASE: ${{ needs.checks.outputs.release }}
          PACKAGE_ARTIFACT_ID: ${{ needs.checks.outputs.artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.checks.outputs.artifact-digest }}
          PACKAGE_ENVELOPE_SHA256: ${{ needs.checks.outputs.envelope-sha256 }}
        run: node scripts/delivery/package-summary.mjs
